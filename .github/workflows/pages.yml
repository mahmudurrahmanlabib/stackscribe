name: Deploy StackScribe to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test API behavior
        run: npm test
      - name: Inject public API endpoint
        env:
          STACKSCRIBE_API_BASE: ${{ vars.STACKSCRIBE_API_BASE }}
        run: |
          printf 'window.STACKSCRIBE_API_BASE = "%s";\n' "$STACKSCRIBE_API_BASE" > config.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
